name: Prepare static site release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated artifact to the protected github-pages environment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qvac-atlas-pages-release
  cancel-in-progress: false

jobs:
  build:
    name: Build reviewed static artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (current v4 peeled commit)
        with:
          version: 11.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the complete local candidate
        run: pnpm check
      - name: Select the GitHub Pages base path
        id: site-base
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "$REPOSITORY_NAME" == "$REPOSITORY_OWNER.github.io" ]]; then
            site_base="/"
          else
            site_base="/$REPOSITORY_NAME/"
          fi
          printf 'base=%s\n' "$site_base" >> "$GITHUB_OUTPUT"
      - name: Build the deployment-path artifact
        env:
          ATLAS_SITE_BASE: ${{ steps.site-base.outputs.base }}
        run: pnpm --filter @qvac-atlas/site build
      - name: Reject generated-data drift and evidence-boundary crossover
        run: |
          git diff --exit-code -- apps/site/src/generated/catalog.json
          node scripts/validate-site-release-catalog.mjs apps/site/src/generated/catalog.json
      - name: Package a Pages-compatible artifact
        run: |
          first_link="$(find apps/site/dist -type l -print -quit)"
          if [[ -n "$first_link" ]]; then
            echo "::error::Pages artifact contains a symbolic link."
            exit 1
          fi
          tar --directory apps/site/dist --create --file "$RUNNER_TEMP/artifact.tar" .
      - name: Upload the inert site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: Deploy after explicit human authorization
    if: inputs.deploy == true && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
