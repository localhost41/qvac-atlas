name: Workspace checks

on:
  pull_request:
  push:
    branches:
      - main
      - integration

permissions:
  contents: read

jobs:
  check:
    name: Validate workspace and contribution data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (current v4 peeled commit)
        with:
          version: 11.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit PR report history and registry admission
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA: ${{ github.sha }}
        run: node scripts/validate-contribution.mjs --base "$BASE_SHA" --target "$TARGET_SHA"
      - name: Audit pushed report history and registry admission
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "::error::Push append-only audit requires an exact nonzero before commit."
            exit 1
          fi
          node scripts/validate-contribution.mjs --base "$BASE_SHA" --target "$TARGET_SHA"
      - run: pnpm check
      - name: Rebuild deterministic catalog
        run: node scripts/build-catalog.mjs
      - name: Reject generated catalog drift
        run: git diff --exit-code -- apps/site/src/generated/catalog.json
